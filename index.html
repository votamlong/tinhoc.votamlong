<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>EduClass Pro - Quản lý sư phạm</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<style>
#side { width: 270px; min-width: 270px; }
.mi { cursor: pointer; border: 0; border-radius: 10px; margin-bottom: 3px; font-weight: 500; }
.mi.on { background: #ebf8ff; color: #2b6cb0; font-weight: 700; }
@media (max-width: 768px) {
  #side { position: fixed; left: -290px; top: 0; bottom: 0; z-index: 99; transition: .3s; }
  #side.open { left: 0; }
}
</style>
</head>
<body class="bg-light">

<!-- GIAO DIỆN ĐĂNG NHẬP -->
<div id="login" class="d-flex align-items-center justify-content-center vh-100">
  <div class="card shadow border-0 rounded-4 p-4" style="width:380px;max-width:92vw">
    <h3 class="fw-bold text-center mb-1">EduClass <span class="text-primary">Pro</span></h3>
    <p class="text-center text-muted small mb-4">Hệ thống quản lý sư phạm (Chế độ độc lập)</p>
    
    <label class="small fw-bold">Email</label>
    <input id="em" class="form-control mb-3" placeholder="admin@edu.vn" value="admin@edu.vn" autocomplete="username">
    
    <label class="small fw-bold">Mật khẩu</label>
    <input id="pw" type="password" class="form-control mb-3" placeholder="admin123@" value="admin123@" autocomplete="current-password">
    
    <button id="lb" class="btn btn-primary w-100 fw-bold rounded-pill" onclick="login()">ĐĂNG NHẬP</button>
    <div class="alert alert-light border small mt-3 mb-0 text-muted">
      💡 <b>Tài khoản sẵn có:</b><br>
      • Admin: <code>admin@edu.vn</code> / <code>admin123@</code><br>
      • GVCN: <code>gvcn@edu.vn</code> / <code>123</code><br>
      • Học sinh: <code>hs1@edu.vn</code> / <code>hs1</code>
    </div>
  </div>
</div>

<!-- GIAO DIỆN CHÍNH SAU KHI VÀO ĐƯỢC -->
<div id="app" class="d-none d-flex vh-100 overflow-hidden">
  <div id="side" class="bg-white border-end d-flex flex-column">
    <div class="p-3 fw-bold text-primary fs-5 border-bottom">
      <i class="fas fa-graduation-cap text-warning me-2"></i>EduClass
    </div>
    <div id="menu" class="list-group list-group-flush p-2 flex-grow-1 overflow-auto"></div>
    <div class="p-3 border-top bg-light">
      <div class="fw-bold small text-truncate" id="un"></div>
      <div class="text-muted small mb-2" id="ur"></div>
      <button class="btn btn-sm btn-outline-danger w-100 rounded-pill" onclick="logout()">Thoát</button>
    </div>
  </div>

  <div class="flex-grow-1 d-flex flex-column overflow-hidden">
    <div class="bg-white border-bottom px-3 py-3 d-flex align-items-center gap-3">
      <button class="btn btn-outline-primary d-md-none" onclick="document.getElementById('side').classList.toggle('open')">
        <i class="fas fa-bars"></i>
      </button>
      <h5 class="m-0 fw-bold text-secondary" id="pt">Tổng quan</h5>
    </div>
    <div id="main" class="p-3 p-md-4 overflow-auto flex-grow-1"></div>
  </div>
</div>

<script>
// ==================== CƠ SỞ DỮ LIỆU ĐỘC LẬP TẠI BROWSER ====================
const DB_USERS = [
  { email: 'admin@edu.vn', pass: 'admin123@', role: 'ADMIN', name: 'Quản trị viên' },
  { email: 'gvcn@edu.vn', pass: '123', role: 'GVCN', name: 'Thầy Nguyễn Văn A' },
  { email: 'gvbm@edu.vn', pass: 'gvbm', role: 'GVBM', name: 'Giáo viên bộ môn' },
  { email: 'hs1@edu.vn', pass: 'hs1', role: 'HS', name: 'Võ Thị Bích Thuận', studentId: 'HS01', class: '10A1' }
];

const DEFAULT_MENUS = [
  { id: 'dashboard', text: 'Tổng quan', icon: 'fa-chart-pie' },
  { id: 'class_manager', text: 'Quản lý lớp', icon: 'fa-users' },
  { id: 'attendance', text: 'Điểm danh', icon: 'fa-calendar-check' },
  { id: 'discipline', text: 'Kỷ luật & Nề nếp', icon: 'fa-user-shield' },
  { id: 'scores', text: 'Sổ ghi điểm', icon: 'fa-marker' },
  { id: 'lucky_wheel', text: 'Vòng quay may mắn', icon: 'fa-circle-notch' },
  { id: 'homework_portal_2627', text: 'Sổ báo bài', icon: 'fa-book-open' },
  { id: 'bonus_points_2627', text: 'Cộng điểm học sinh', icon: 'fa-star' },
  { id: 'sll_2627', text: 'Sổ liên lạc', icon: 'fa-address-book' }
];

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const opt = a => a.map(x => `<option>${esc(x)}</option>`).join('');
const main = h => { $('#main').innerHTML = h; };

let user = null;

// ==================== GIẢ LẬP BACKEND TRONG LOCALSTORAGE ====================
function localDB(key, defaultData) {
  const data = localStorage.getItem('edu_' + key);
  return data ? JSON.parse(data) : defaultData;
}
function saveLocalDB(key, data) {
  localStorage.setItem('edu_' + key, JSON.stringify(data));
}

// Hàm gọi API nội bộ, không phụ thuộc mạng
async function api(fn, ...args) {
  await new Promise(r => setTimeout(r, 100)); // Giả lập độ trễ phản hồi nhẹ
  
  if (fn === 'loginUser') {
    const [email, pass] = args;
    const found = DB_USERS.find(u => u.email === email && u.pass === pass);
    if (found) {
      return {
        success: true,
        token: 'local-token-' + Date.now(),
        role: found.role,
        name: found.name,
        studentId: found.studentId || '',
        menu: DEFAULT_MENUS
      };
    }
    return { success: false, message: 'Sai email hoặc mật khẩu!' };
  }

  if (fn === 'getAllClasses') return ['10A1', '10A2', '11A1', '12A1'];
  
  if (fn === 'getDashboardData') {
    return { siso: 45, tile: 78, chart: ['25 Giỏi', '15 Khá', '5 TB'] };
  }

  if (fn === 'getClassOverview' || fn === 'getStudentList') {
    return [
      { id: 'HS01', name: 'Nguyễn Văn Nam', gpa: 8.5, conduct: 'Tốt' },
      { id: 'HS02', name: 'Lê Hoàng Khang', gpa: 7.2, conduct: 'Khá' },
      { id: 'HS03', name: 'Trần Thị Mai', gpa: 6.8, conduct: 'TB' }
    ];
  }

  if (fn === 'getViolationTypes') return ['Đi trễ', 'Không đồng phục', 'Mất trật tự', 'Không học bài'];
  if (fn === 'getSubjectsList') return ['Tin học', 'Toán', 'Văn', 'Tiếng Anh'];

  if (fn === 'crudList') {
    const sheetName = args[0];
    return localDB(sheetName, []);
  }

  if (fn === 'crudAdd') {
    const [sheetName, headers, cells] = args;
    let list = localDB(sheetName, []);
    list.push({ row: list.length + 1, cells: cells });
    saveLocalDB(sheetName, list);
    return 'Lưu thành công!';
  }

  if (fn === 'crudDelete') {
    const [sheetName, headers, row] = args;
    let list = localDB(sheetName, []);
    list = list.filter(x => x.row !== row);
    saveLocalDB(sheetName, list);
    return 'Đã xóa!';
  }

  return 'OK';
}

// ==================== CÁC HÀM XỬ LÝ GIAO DIỆN ====================
async function login() {
  const b = $('#lb'); b.disabled = true;
  try {
    const r = await api('loginUser', $('#em').value.trim(), $('#pw').value.trim());
    if (!r.success) throw new Error(r.message);
    localStorage.setItem('tok', r.token);
    localStorage.setItem('usr', JSON.stringify(r));
    start(r);
  } catch (e) { alert(e.message); }
  b.disabled = false;
}

function logout() {
  localStorage.removeItem('tok');
  localStorage.removeItem('usr');
  location.reload();
}

function start(r) {
  user = r;
  $('#login').classList.add('d-none');
  $('#app').classList.remove('d-none');
  $('#un').textContent = r.name || 'Người dùng';
  $('#ur').textContent = r.role || '';
  $('#menu').innerHTML = (r.menu || []).map(m =>
    `<div class="mi list-group-item" data-id="${esc(m.id)}" onclick="go('${esc(m.id)}')"><i class="fas ${esc(m.icon)} me-2"></i>${esc(m.text)}</div>`
  ).join('');
  go(r.role === 'HS' ? 'my_profile' : 'dashboard');
}

async function go(id) {
  document.querySelectorAll('.mi').forEach(x => x.classList.toggle('on', x.dataset.id === id));
  $('#side').classList.remove('open');
  const m = (user.menu || []).find(x => x.id === id);
  $('#pt').textContent = m ? m.text : id;
  main('<div class="p-5 text-center text-muted">Đang tải...</div>');
  try {
    if (V[id]) await V[id]();
    else if (C[id]) await crud(id);
    else main('<div class="alert alert-info">Chức năng này đã sẵn sàng.</div>');
  } catch (e) {
    main('<div class="alert alert-danger">Lỗi: ' + esc(e.message) + '</div>');
  }
}

const V = {};

V.dashboard = async () => {
  const cs = await api('getAllClasses');
  main(`<div class="d-flex gap-2 mb-3 align-items-center"><b>Lọc lớp:</b><select id="dc" class="form-select w-auto"><option value="">Toàn trường</option>${opt(cs)}</select></div><div class="row g-3" id="ds"></div>`);
  const card = (t, v) => `<div class="col-md-4"><div class="card p-4 text-center border-0 shadow-sm"><h2>${esc(v)}</h2><small class="text-muted">${t}</small></div></div>`;
  const f = async () => {
    const d = await api('getDashboardData', $('#dc').value);
    $('#ds').innerHTML = card('SĨ SỐ', d.siso) + card('TỶ LỆ GIỎI', d.tile + '%') + card('GIỎI / KHÁ / TB', d.chart.join(' / '));
  };
  $('#dc').onchange = f; f();
};

V.class_manager = async () => {
  const cs = await api('getAllClasses');
  main(`<div class="card p-3"><select id="c1" class="form-select w-auto mb-3">${opt(cs)}</select><div class="table-responsive"><table class="table"><thead><tr><th>Học sinh</th><th>GPA</th><th>Hạnh kiểm</th></tr></thead><tbody id="tb"></tbody></table></div></div>`);
  const f = async () => {
    const l = await api('getClassOverview', $('#c1').value);
    $('#tb').innerHTML = l.map(s => `<tr><td>${esc(s.name)}</td><td>${esc(s.gpa)}</td><td><select class="form-select form-select-sm w-auto">${['Tốt','Khá','TB','Yếu'].map(v => `<option${s.conduct == v ? ' selected' : ''}>${v}</option>`).join('')}</select></td></tr>`).join('');
  };
  $('#c1').onchange = f; f();
};

V.attendance = async () => {
  const cs = await api('getAllClasses');
  main(`<div class="card p-3"><div class="d-flex gap-2 mb-3"><select id="c1" class="form-select w-auto">${opt(cs)}</select><button id="sv" class="btn btn-primary" onclick="alert('Đã lưu điểm danh vào bộ nhớ!')">LƯU</button></div><table class="table"><tbody id="tb"></tbody></table></div>`);
  const f = async () => {
    const L = await api('getStudentList', $('#c1').value);
    $('#tb').innerHTML = L.map(s => `<tr><td>${esc(s.name)}</td><td class="text-end"><label class="me-3"><input type="radio" name="a${esc(s.id)}" checked> Có</label><label class="text-danger"><input type="radio" name="a${esc(s.id)}"> Vắng</label></td></tr>`).join('');
  };
  $('#c1').onchange = f; f();
};

V.lucky_wheel = async () => {
  let pool = [
    { name: 'Nguyễn Văn Nam' }, { name: 'Võ Thị Bích Thuận' }, { name: 'Lê Hoàng Khang' },
    { name: 'Trần Thị Mai' }, { name: 'Hồ Nam Châu' }, { name: 'Võ Tuấn' }
  ], called = [], ang = 0, spin = false;

  main(`<div class="row g-3"><div class="col-lg-7 text-center"><div class="card p-3"><textarea id="wt" class="form-control mb-2" rows="2" placeholder="Dán danh sách tên (mỗi dòng 1 tên)"></textarea><button id="wa" class="btn btn-outline-primary btn-sm mb-2">Áp dụng danh sách</button><div class="position-relative d-inline-block"><canvas id="cv" width="420" height="420" style="max-width:100%"></canvas><button id="sp" class="btn btn-danger rounded-circle position-absolute top-50 start-50 translate-middle fw-bold" style="width:70px;height:70px">QUAY</button></div><div id="win" class="alert alert-success mt-2 d-none"></div></div></div><div class="col-lg-5"><div class="card p-3"><b>Đã gọi (<span id="cc">0</span>) · Còn <span id="rc">0</span></b><ol id="cl" class="small mt-2"></ol></div></div></div>`);

  const draw = () => {
    const c = $('#cv').getContext('2d'), n = pool.length; c.clearRect(0, 0, 420, 420);
    if (!n) { c.fillStyle = '#6c757d'; c.font = '16px Arial'; c.fillText('Hết danh sách!', 140, 210); return; }
    const a = 2 * Math.PI / n;
    pool.forEach((s, i) => {
      c.beginPath(); c.moveTo(210, 210); c.arc(210, 210, 200, ang + i * a, ang + (i + 1) * a);
      c.fillStyle = `hsl(${i * 360 / n},70%,55%)`; c.fill();
      c.save(); c.translate(210, 210); c.rotate(ang + (i + .5) * a);
      c.fillStyle = '#fff'; c.font = 'bold 13px Arial'; c.textAlign = 'right';
      c.fillText(s.name.slice(0, 18), 190, 4); c.restore();
    });
    c.beginPath(); c.moveTo(198, 0); c.lineTo(222, 0); c.lineTo(210, 28); c.fillStyle = '#000'; c.fill();
  };

  const refresh = () => {
    $('#cc').textContent = called.length; $('#rc').textContent = pool.length;
    $('#cl').innerHTML = called.map(s => `<li>${esc(s.name)}</li>`).join('');
    draw();
  };

  $('#wa').onclick = () => {
    pool = $('#wt').value.split('\n').map(x => x.trim()).filter(Boolean).map(n => ({ name: n }));
    called = []; refresh();
  };

  $('#sp').onclick = () => {
    if (spin || !pool.length) return; spin = true;
    const t0 = performance.now(), a0 = ang, tot = Math.PI * 2 * (5 + Math.random() * 3);
    const step = t => {
      const p = Math.min((t - t0) / 4500, 1);
      ang = a0 + tot * (1 - Math.pow(1 - p, 3));
      draw();
      if (p < 1) return requestAnimationFrame(step);
      spin = false;
      const a = 2 * Math.PI / pool.length, T = 2 * Math.PI;
      const k = Math.floor((((-Math.PI / 2 - ang) % T) + T) % T / a);
      const w = pool.splice(k, 1)[0];
      called.push(w);
      $('#win').classList.remove('d-none');
      $('#win').innerHTML = 'Xin chúc mừng: <b>' + esc(w.name) + '</b>';
      refresh();
    };
    requestAnimationFrame(step);
  };
  refresh();
};

const C = {};
[
 'homework_portal_2627;Sổ báo bài;M_BAOBAI;Ngày|Lớp|Môn|Nội dung bài tập|Hạn nộp',
 'bonus_points_2627;Cộng điểm học sinh;M_CONGDIEM;Ngày|Lớp|Học sinh|Điểm cộng|Lý do',
 'sll_2627;Sổ liên lạc;M_SLL;Ngày|Lớp|Học sinh|Nội dung|Phản hồi phụ huynh'
].forEach(l => { const p = l.split(';'); C[p[0]] = { t: p[1], s: p[2], f: p[3].split('|') }; });

async function crud(id) {
  const m = C[id];
  main(`<div class="card p-3 mb-3"><b class="text-primary mb-2">${m.t}</b><div class="row g-2 align-items-end">${m.f.map((f, i) => `<div class="col-6 col-md-3"><label class="small fw-bold">${f}</label><input class="form-control form-control-sm" data-i="${i}" type="text"></div>`).join('')}<div class="col-6 col-md-2"><button id="ad" class="btn btn-primary btn-sm w-100">LƯU</button></div></div></div><div class="card"><div class="table-responsive"><table class="table table-sm table-hover mb-0"><thead><tr>${m.f.map(f => `<th>${f}</th>`).join('')}<th></th></tr></thead><tbody id="tb"></tbody></table></div></div>`);
  
  const ld = async () => {
    const r = await api('crudList', m.s, m.f);
    $('#tb').innerHTML = r.slice().reverse().map(x => '<tr>' + x.cells.map(c => `<td>${esc(c)}</td>`).join('') + `<td><button class="btn btn-sm text-danger" data-r="${x.row}">✕</button></td></tr>`).join('') || '<tr><td colspan="10" class="text-center text-muted p-3">Chưa có dữ liệu</td></tr>';
  };
  
  $('#ad').onclick = async () => {
    const c = [...document.querySelectorAll('[data-i]')].map(i => i.value.trim());
    if (!c.some(Boolean)) return alert('Hãy nhập thông tin!');
    await api('crudAdd', m.s, m.f, c);
    crud(id);
  };
  
  $('#tb').onclick = async e => {
    const r = e.target.dataset.r;
    if (r && confirm('Xóa dòng này?')) {
      await api('crudDelete', m.s, m.f, +r);
      ld();
    }
  };
  ld();
}

$('#pw').addEventListener('keydown', e => { if (e.key === 'Enter') login(); });
try {
  const s = localStorage.getItem('usr');
  if (s && localStorage.getItem('tok')) start(JSON.parse(s));
} catch (e) { localStorage.removeItem('usr'); }
</script>
</body>
</html>
