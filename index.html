function allowed(){
  const r=String(USER.role).toUpperCase();
  if(ROLES[r]){const s=ROLES[r].split(',');return MENU.filter(m=>s.includes(m.id))}
  return MENU.filter(m=>r==='ADMIN'||m.a==='M'||(m.a==='G')||(m.a==='C'&&r.startsWith('GVCN')));
}

function login(){
  const u=D('users').find(u=>u.email.toLowerCase()===$('email').value.trim().toLowerCase()&&u.pass===$('pass').value);
  if(!u)return $('err').innerText='Sai Email hoặc Mật khẩu!';
  USER=u;sessionStorage.setItem('u',u.email);boot();
}
function logout(){sessionStorage.removeItem('u');location.reload()}
let MY=[];
function boot(){
  $('login').classList.add('d-none');$('app').classList.remove('d-none');
  $('uname').innerText=USER.name;$('urole').innerText=USER.role;
  MY=allowed();
  $('menu').innerHTML=MY.map(m=>`<div class="list-group-item mi" data-id="${m.id}" onclick="go('${m.id}')"><i class="fas fa-${m.i} text-primary me-2"></i>${esc(m.t)}</div>`).join('');
  go('dashboard');
}
function filterMenu(){const q=$('msearch').value.toLowerCase();document.querySelectorAll('.mi').forEach(e=>e.style.display=e.innerText.toLowerCase().includes(q)?'':'none')}
window.onload=()=>{const e=sessionStorage.getItem('u'),u=e&&D('users').find(x=>x.email===e);if(u){USER=u;boot()}};

function go(id){
  const m=MENU.find(x=>x.id===id);
  document.querySelectorAll('.mi').forEach(e=>e.classList.toggle('active',e.dataset.id===id));
  $('title').innerText=m.t;$('sidebar').classList.remove('open');
  const[h,p]=m.h.split(':');
  (h==='crud'?vCrud:h==='pick'?vPick:h==='rep'?vRep:h==='trend'?vTrend:VIEWS[h])(p);
}

const parseF=k=>F[k].split(',').map(x=>{const[a,l,t='t']=x.split(':');return{k:a,l,t}});

function fld(f){
  const id='f_'+f.k,c='form-control form-control-sm',sel=(o)=>`<select id="${id}" class="form-select form-select-sm">${o}</select>`;
  const op=a=>a.map(x=>`<option>${esc(x)}</option>`).join('');
  if(f.t=='a')return`<textarea id="${id}" class="${c}" rows="2"></textarea>`;
  if(f.t=='n')return`<input id="${id}" type="number" step="any" class="${c}">`;
  if(f.t=='d')return`<input id="${id}" type="date" class="${c}" value="${f.k=='ngay'?today():''}">`;
  if(f.t=='c')return`<input id="${id}" list="cls" class="${c}" onchange="fillS()">`;
  if(f.t=='s')return sel('');
  if(f.t=='L')return sel(op(D('loi').map(x=>x.name)));
  if(f.t=='M')return sel(op(D('mon').map(x=>x.name)));
  if(f.t=='T')return sel(op(D('tiet').map(x=>x.name)));
  if(f.t[0]=='o')return sel(op(f.t.split('=')[1].split('/')));
  return`<input id="${id}" class="${c}">`;
}

function fillS(v){const s=$('f_hs');if(!s)return;const l=$('f_lop');s.innerHTML=stOf(l?l.value:'').map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('');if(v)s.value=v}
const dtxt=v=>/^\d{4}-\d\d-\d\dT/.test(v)?v.slice(0,16).replace('T',' '):v;

function vCrud(key){
  CK=key;EDIT=null;const fs=parseF(key);
  $('content').innerHTML=`<datalist id="cls">${classes().map(c=>`<option>${esc(c)}</option>`).join('')}</datalist>
  <div class="card p-3 mb-3 border-0 shadow-sm"><div class="row g-2">${fs.map(f=>`<div class="col-md-${f.t=='a'?6:3} col-6"><label class="small fw-bold">${f.l}</label>${fld(f)}</div>`).join('')}
  <div class="col-12"><button class="btn btn-primary btn-sm px-4" onclick="crudSave()">LƯU</button> <button class="btn btn-light btn-sm" onclick="vCrud(CK)">Hủy</button>
  <button class="btn btn-outline-secondary btn-sm float-end" onclick="crudCSV()"><i class="fas fa-file-csv"></i> CSV</button></div></div></div>
  ${fs.some(f=>f.k=='lop')?`<select id="cf" class="form-select form-select-sm w-auto mb-2" onchange="crudList()">${clsOpts(1)}</select>`:''}
  <div id="csum" class="mb-2"></div><div class="card table-responsive"><table class="table table-sm table-hover align-middle mb-0 small"><thead class="table-light"><tr>${fs.map(f=>`<th>${f.l}</th>`).join('')}${COMP[key]?`<th>${COMP[key][0]}</th>`:''}<th></th></tr></thead><tbody id="cl"></tbody></table></div>`;
  fillS();crudList();
}

const coll=()=>D(COLL[CK]||CK);
function rows(){const c=$('cf')?$('cf').value:'';return coll().map((r,i)=>({r,i})).filter(x=>!c||x.r.lop===c)}
function crudList(){
  const fs=parseF(CK),L=rows();
  $('cl').innerHTML=L.slice().reverse().map(({r,i})=>`<tr>${fs.map(f=>`<td>${esc(f.t=='s'?(r.name||r[f.k]):f.t=='n'||f.k=='pass'&&0?r[f.k]:dtxt(r[f.k]))}</td>`).join('')}${COMP[CK]?`<td class="fw-bold">${COMP[CK][1](r)}</td>`:''}
  <td class="text-nowrap"><button class="btn btn-sm text-primary" onclick="crudEdit(${i})"><i class="fas fa-edit"></i></button><button class="btn btn-sm text-danger" onclick="crudDel(${i})"><i class="fas fa-trash"></i></button></td></tr>`).join('')||'<tr><td colspan="20" class="text-center text-muted p-4">Chưa có dữ liệu</td></tr>';
  if(fs.some(f=>f.k=='amt')){const s=t=>L.filter(x=>x.r.loai==t).reduce((a,x)=>a+(x.r.amt||0),0);
  $('csum').innerHTML=`<span class="badge bg-success me-1">Thu: ${vnd(s('Thu'))}</span><span class="badge bg-danger me-1">Chi: ${vnd(s('Chi'))}</span><span class="badge bg-primary">Tồn: ${vnd(s('Thu')-s('Chi'))}</span>`}
}

function crudSave(){
  const fs=parseF(CK),r={};fs.forEach(f=>{const v=$('f_'+f.k).value;r[f.k]=f.t=='n'?Number(v)||0:v.trim()});
  if(!fs.some(f=>f.t!='n'&&r[f.k]))return alert('Nhập dữ liệu!');
  if(r.hs){const s=D('students').find(x=>x.id==r.hs);if(s){r.id=s.id;r.name=s.name;r.lop=r.lop||s.lop}}
  if(CK=='advatt')r.status=r.status||'C';
  const old=EDIT!=null?coll()[EDIT]:{};Object.assign(old,r);if(!old.date)old.date=r.ngay||new Date().toISOString();if(r.ngay)old.date=r.ngay;old._by=USER.name;
  if(EDIT==null)coll().push(old);save();vCrud(CK);
}

function crudEdit(i){const r=coll()[i];EDIT=i;parseF(CK).forEach(f=>{if(f.t=='s')fillS(r.hs);else if($('f_'+f.k))$('f_'+f.k).value=r[f.k]??''});window.scrollTo(0,0);$('content').scrollTop=0}
function crudDel(i){if(confirm('Xóa dòng này?')){coll().splice(i,1);save();crudList()}}

/* Chuông & trống */
let AC=null;
const actx=()=>AC=AC||new(window.AudioContext||window.webkitAudioContext)();
function ring(freq,n,type='sine'){
  const a=actx();
  for(let i=0;i<n;i++){
    const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+i*.7;
    o.type=type;o.frequency.value=freq;o.connect(g);g.connect(a.destination);
    g.gain.setValueAtTime(.3,t);g.gain.exponentialRampToValueAtTime(.001,t+.6);o.start(t);o.stop(t+.6);
  }
}
function drum(n){
  const a=actx();
  for(let i=0;i<n;i++){
    const o=a.createOscillator(),g=a.createGain(),t=a.currentTime+i*.35;
    o.frequency.setValueAtTime(160,t);o.frequency.exponentialRampToValueAtTime(50,t+.25);
    o.connect(g);g.connect(a.destination);
    g.gain.setValueAtTime(.8,t);g.gain.exponentialRampToValueAtTime(.001,t+.3);o.start(t);o.stop(t+.3);
  }
}

/* ===== GỌI GEMINI (tự thử lại + model dự phòng) ===== */
// API key KHÔNG ghi trong code: sẽ hỏi 1 lần rồi lưu trong trình duyệt này (localStorage).
const GEMINI_MODELS=["gemini-2.5-flash","gemini-2.0-flash","gemini-2.5-flash-lite"];
function getKey(){
  let k=localStorage.getItem('gemini_key')||'';
  if(!k){k=(prompt('Dán Gemini API key của bạn (chỉ lưu trên trình duyệt này):')||'').trim();if(k)localStorage.setItem('gemini_key',k)}
  return k;
}
const wait=ms=>new Promise(ok=>setTimeout(ok,ms));
async function callGemini(payload){
  const key=getKey();if(!key)throw new Error('Chưa có API key Gemini.');
  let lastErr=new Error('Không gọi được Gemini');
  for(const model of GEMINI_MODELS){
    for(let i=0;i<3;i++){
      let r,j;
      try{
        r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`,{
          method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});
        j=await r.json().catch(()=>({}));
      }catch(e){lastErr=e;await wait(1500*(i+1));continue}
      if(r.ok&&!j.error)return j;
      lastErr=new Error(j.error?.message||'Lỗi Gemini ('+r.status+')');
      if([400,401,403].includes(r.status)){
        if(/API key/i.test(lastErr.message))localStorage.removeItem('gemini_key');
        throw lastErr;
      }
      if(r.status===404)break;                       // model không tồn tại -> thử model kế tiếp
      if(![429,500,503].includes(r.status))throw lastErr;
      await wait(1500*(i+1));                        // quá tải -> chờ rồi thử lại
    }
  }
  throw lastErr;
}

async function genQuiz(){
  const n=Math.min(40,+$('qn').value||10);
  const v=id=>$('q'+id).value.trim();
  if(!v('t'))return alert('Nhập chủ đề!');

  const p=`Bạn là giáo viên môn ${v('m')} ở Việt Nam. Hãy soạn ${n} câu hỏi trắc nghiệm, mỗi câu có 4 đáp án và chỉ MỘT đáp án đúng. Khối/lớp: ${v('k')}. Chủ đề: ${v('t')}. Mức độ: ${v('l')}. ${v('x')} Nội dung phải chính xác, phù hợp học sinh, đáp án đúng phân bố ngẫu nhiên giữa các vị trí. Trả về DUY NHẤT một mảng JSON (không dùng markdown), mỗi phần tử có dạng {"q":"nội dung câu hỏi","o":["đáp án A","đáp án B","đáp án C","đáp án D"],"a":0,"e":"giải thích ngắn"}; "a" là chỉ số (0-3) của đáp án đúng. Không thêm tiền tố "A.","B." vào nội dung đáp án.`;

  $('qbtn').disabled=true;
  $('qst').innerText='⏳ Gemini đang soạn đề (tự thử lại nếu máy chủ quá tải)...';

  try {
    const payload = {
      contents: [{ parts: [{ text: p }] }],
      generationConfig: { responseMimeType: "application/json" }
    };

    const j = await callGemini(payload);

    const rawText = j.candidates?.[0]?.content?.parts?.[0]?.text || "";
    const cleanJson = rawText.replace(/```json|```/g, '').trim();
    const a = JSON.parse(cleanJson);

    if(!Array.isArray(a) || !a.length) throw new Error('AI trả về sai cấu trúc mảng câu hỏi.');

    QZ = a.filter(x => x && x.q && Array.isArray(x.o)).map(x => ({
      q: x.q,
      o: [0, 1, 2, 3].map(i => String(x.o[i] ?? '')),
      a: Math.min(3, Math.max(0, +x.a || 0)),
      e: x.e || ''
    }));

    $('qst').innerText = '✅ Đã soạn ' + QZ.length + ' câu — hãy kiểm tra lại trước khi dùng!';
    drawQuiz();
  } catch(e) {
    $('qst').innerText = '❌ ' + e.message;
  }
  $('qbtn').disabled = false;
}

function drawQuiz(){
  $('qr').innerHTML=`<div class="${card}"><div class="d-flex flex-wrap gap-2 mb-3"><button class="btn btn-success btn-sm" onclick="saveQuiz()">💾 Lưu đề</button><button class="btn btn-outline-primary btn-sm" onclick="printQuiz(0)">🖨 In đề</button><button class="btn btn-outline-danger btn-sm" onclick="printQuiz(1)">🖨 In đề + đáp án</button><button class="btn btn-outline-secondary btn-sm" onclick="dl('de-trac-nghiem.json',JSON.stringify(QZ,null,1),'application/json')">JSON</button></div>

/* ===== XỬ LÝ CHẤM BÀI TỰ LUẬN TRÊN FILE PDF (GEMINI VISION) ===== */
let pdfDocRaw = null;
let pdfJsDoc = null;
let currentPdfPage = 1;
let totalPdfPages = 0;
let pdfScale = 1.3;
let pdfTool = 'draw';
let isPdfPainting = false;
let pageAnnotations = {};

function initPdfGradingModule() {
  if (window.pdfjsLib) {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  }
}

async function loadPdfFile(event) {
  const file = event.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = async function() {
    pdfDocRaw = new Uint8Array(this.result);
    pdfJsDoc = await pdfjsLib.getDocument({ data: pdfDocRaw.slice() }).promise;
    totalPdfPages = pdfJsDoc.numPages;
    currentPdfPage = 1;
    pageAnnotations = {};
    if($('pdfLoadingNotice')) $('pdfLoadingNotice').classList.add('d-none');
    renderCurrentPdfPage();
  };
  reader.readAsArrayBuffer(file);
}

async function renderCurrentPdfPage() {
  if (!pdfJsDoc) return;
  $('pdfPageIndicator').innerText = `${currentPdfPage} / ${totalPdfPages}`;

  const page = await pdfJsDoc.getPage(currentPdfPage);
  const viewport = page.getViewport({ scale: pdfScale });

  const renderCanvas = $('pdfRenderCanvas');
  const drawCanvas = $('pdfDrawCanvas');

  renderCanvas.width = viewport.width;
  renderCanvas.height = viewport.height;
  drawCanvas.width = viewport.width;
  drawCanvas.height = viewport.height;

  const renderCtx = renderCanvas.getContext('2d');
  await page.render({ canvasContext: renderCtx, viewport: viewport }).promise;

  setupDrawCanvas(drawCanvas);
  restorePageAnnotations(currentPdfPage);
}

function setupDrawCanvas(canvas) {
  const ctx = canvas.getContext('2d');
  ctx.strokeStyle = '#e53e3e';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  canvas.onmousedown = (e) => {
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;

    if (pdfTool === 'draw') {
      isPdfPainting = true;
      ctx.beginPath();
      ctx.moveTo(x, y);
      saveAction(currentPdfPage, { type: 'pathStart', x, y });
    } else if (pdfTool === 'text') {
      const text = prompt('Nhập nhận xét / ghi chú bằng bút đỏ:');
      if (text) {
        drawTextOnCanvas(ctx, text, x, y);
        saveAction(currentPdfPage, { type: 'text', text, x, y });
      }
    }
  };

  canvas.onmousemove = (e) => {
    if (!isPdfPainting || pdfTool !== 'draw') return;
    const rect = canvas.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    ctx.lineTo(x, y);
    ctx.stroke();
    saveAction(currentPdfPage, { type: 'pathPoint', x, y });
  };

  canvas.onmouseup = () => {
    if (isPdfPainting) {
      isPdfPainting = false;
      saveAction(currentPdfPage, { type: 'pathEnd' });
    }
  };
}

function drawTextOnCanvas(ctx, text, x, y, size=16, isScore=false) {
  ctx.font = `bold ${size}px "Segoe UI", Tahoma, sans-serif`;
  ctx.fillStyle = '#e53e3e';
  if (isScore) {
    ctx.strokeStyle = '#e53e3e';
    ctx.lineWidth = 2.5;
    const padding = 8;
    const textWidth = ctx.measureText(text).width;
    ctx.strokeRect(x - padding, y - size - padding/2, textWidth + padding*2, size + padding*1.5);
  }
  ctx.fillText(text, x, y);
}

function saveAction(pageNum, action) {
  if (!pageAnnotations[pageNum]) pageAnnotations[pageNum] = [];
  pageAnnotations[pageNum].push(action);
}

function restorePageAnnotations(pageNum) {
  const actions = pageAnnotations[pageNum] || [];
  const canvas = $('pdfDrawCanvas');
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.strokeStyle = '#e53e3e';
  ctx.lineWidth = 3;
  ctx.lineCap = 'round';

  actions.forEach(act => {
    if (act.type === 'pathStart') {
      ctx.beginPath();
      ctx.moveTo(act.x, act.y);
    } else if (act.type === 'pathPoint') {
      ctx.lineTo(act.x, act.y);
      ctx.stroke();
    } else if (act.type === 'text') {
      drawTextOnCanvas(ctx, act.text, act.x, act.y, act.size||16, act.isScore||false);
    }
  });
}

function setPdfTool(tool) {
  pdfTool = tool;
  $('btnToolDraw').classList.toggle('active', tool === 'draw');
  $('btnToolText').classList.toggle('active', tool === 'text');
}

function addPdfQuickStamp(stampText) {
  if (!pdfJsDoc) return alert('Hãy tải file PDF trước!');
  const canvas = $('pdfDrawCanvas');
  const ctx = canvas.getContext('2d');
  const x = 50, y = 50;
  drawTextOnCanvas(ctx, stampText, x, y, 18);
  saveAction(currentPdfPage, { type: 'text', text: stampText, x, y, size: 18 });
}

function clearPdfAnnotations() {
  if (confirm('Xóa toàn bộ nhận xét và nét vẽ trang này?')) {
    pageAnnotations[currentPdfPage] = [];
    const canvas = $('pdfDrawCanvas');
    canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
  }
}

async function changePdfPage(delta) {
  const next = currentPdfPage + delta;
  if (next >= 1 && next <= totalPdfPages) {
    currentPdfPage = next;
    await renderCurrentPdfPage();
  }
}

/* Chấm bài tự động qua Gemini Vision */
async function gradeWithAi() {
  if (!pdfJsDoc) return alert('Vui lòng chọn file PDF bài làm của học sinh trước!');

  const btn = $('btnAiGrade');
  const status = $('aiGradeStatus');
  const rubric = ($('aiRubric')?.value || '').trim();

  btn.disabled = true;
  status.innerHTML = `<span class="text-primary"><i class="fas fa-spinner fa-spin"></i> Gemini đang đọc & chấm bài trang ${currentPdfPage}...</span>`;

  try {
    const renderCanvas = $('pdfRenderCanvas');
    const base64Image = renderCanvas.toDataURL('image/jpeg', 0.85).split(',')[1];

    const promptText = `Bạn là một giáo viên kinh nghiệm tại Việt Nam. Hãy đọc hình ảnh bài làm tự luận này của học sinh trên trang hiện tại và chấm điểm.
${rubric ? 'YÊU CẦU / ĐÁP ÁN THAM CHIẾU: ' + rubric : ''}
Hãy đánh giá công tâm, chính xác.
Trả về DUY NHẤT một chuỗi JSON chuẩn (không dùng markdown code fence), theo định dạng sau:
{
  "diem": "8.5/10",
  "loi_phe": "Lời phê ngắn gọn của giáo viên (tối đa 25 từ)",
  "chi_tiet": "Nhận xét chi tiết ưu/nhược điểm",
  "danh_gia_nhanh": "✔ ĐÚNG"
}`;

    const payload = {
      contents: [{
        parts: [
          { text: promptText },
          { inlineData: { mimeType: "image/jpeg", data: base64Image } }
        ]
      }],
      generationConfig: { responseMimeType: "application/json" }
    };

    const jsonRes = await callGemini(payload);

    const raw = jsonRes.candidates?.[0]?.content?.parts?.[0]?.text || "{}";
    const result = JSON.parse(raw.replace(/```json|```/g, '').trim());

    // Đóng dấu mực đỏ lên trang bài làm của học sinh
    const canvas = $('pdfDrawCanvas');
    const ctx = canvas.getContext('2d');

    // 1. Đóng khung điểm số ở góc trên bên phải
    const scoreText = `ĐIỂM: ${result.diem || 'Đạt'}`;
    const scoreX = Math.max(canvas.width - 180, 20);
    const scoreY = 45;
    drawTextOnCanvas(ctx, scoreText, scoreX, scoreY, 20, true);
    saveAction(currentPdfPage, { type: 'text', text: scoreText, x: scoreX, y: scoreY, size: 20, isScore: true });

    // 2. Ghi lời phê của giáo viên ở đầu trang bên trái
    const commentText = `Lời phê: ${result.loi_phe || 'Bài làm tốt'}`;
    const commentX = 30;
    const commentY = 45;
    drawTextOnCanvas(ctx, commentText, commentX, commentY, 15, false);
    saveAction(currentPdfPage, { type: 'text', text: commentText, x: commentX, y: commentY, size: 15 });

    // 3. Đóng dấu nhận xét
    if (result.danh_gia_nhanh) {
      const stampX = 30;
      const stampY = 80;
      drawTextOnCanvas(ctx, result.danh_gia_nhanh, stampX, stampY, 16, false);
      saveAction(currentPdfPage, { type: 'text', text: result.danh_gia_nhanh, x: stampX, y: stampY, size: 16 });
    }

    status.innerHTML = `<span class="text-success"><i class="fas fa-check-circle"></i> Đã chấm xong trang ${currentPdfPage}: <b>${esc(result.diem)}</b></span>`;
    alert(`🎉 KẾT QUẢ CHẤM CỦA GEMINI (Trang ${currentPdfPage}):\n\n- Điểm số: ${result.diem}\n- Lời phê: ${result.loi_phe}\n- Nhận xét chi tiết: ${result.chi_tiet || 'Không có'}\n\nĐã tự động đóng dấu điểm đỏ và lời phê vào bài!`);
  } catch (err) {
    status.innerHTML = `<span class="text-danger"><i class="fas fa-exclamation-triangle"></i> ${esc(err.message)}</span>`;
  }
  btn.disabled = false;
}

async function exportGradedPdf() {
  if (!pdfDocRaw) return alert('Chưa có file PDF nào được chọn!');

  const { PDFDocument } = PDFLib;
  const pdfDoc = await PDFDocument.load(pdfDocRaw);
  const totalPages = pdfDoc.getPageCount();

  for (let i = 1; i <= totalPages; i++) {
    const actions = pageAnnotations[i];
    if (actions && actions.length > 0) {
      const tempCanvas = document.createElement('canvas');
      const targetPage = pdfDoc.getPage(i - 1);
      const { width, height } = targetPage.getSize();

      tempCanvas.width = width * 1.5;
      tempCanvas.height = height * 1.5;
      const ctx = tempCanvas.getContext('2d');
      const ratio = tempCanvas.width / $('pdfDrawCanvas').width;

      ctx.scale(ratio, ratio);
      ctx.strokeStyle = '#e53e3e';
      ctx.lineWidth = 3;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      actions.forEach(act => {
        if (act.type === 'pathStart') {
          ctx.beginPath();
          ctx.moveTo(act.x, act.y);
        } else if (act.type === 'pathPoint') {
          ctx.lineTo(act.x, act.y);
          ctx.stroke();
        } else if (act.type === 'text') {
          drawTextOnCanvas(ctx, act.text, act.x, act.y, act.size||16, act.isScore||false);
        }
      });

      const pngUrl = tempCanvas.toDataURL('image/png');
      const pngImageBytes = await fetch(pngUrl).then(res => res.arrayBuffer());
      const pngImage = await pdfDoc.embedPng(pngImageBytes);

      targetPage.drawImage(pngImage, {
        x: 0,
        y: 0,
        width: width,
        height: height,
      });
    }
  }

  const pdfBytes = await pdfDoc.save();
  dl('Bai_Lam_Da_Cham.pdf', pdfBytes, 'application/pdf');
}

function vRep(m){
  const t=today();
  C(`<div class="${card}"><div class="d-flex flex-wrap gap-2"><input type="date" id="rs" class="form-control form-control-sm w-auto" value="${t}"><input type="date" id="re" class="form-control form-control-sm w-auto" value="${t}">
  ${m=='sum'?'':sel('rc',clsOpts(1))+sel('rt','<option value="">Mọi lỗi</option>'+D('loi').map(l=>`<option>${esc(l.name)}</option>`).join(''))+'<input id="rq" class="form-control form-control-sm w-auto" placeholder="Tên HS...">'}
  <button class="btn btn-danger btn-sm px-4" onclick="runRep('${m}')">LỌC</button></div></div><div class="card table-responsive"><table class="table table-hover table-sm mb-0 small"><tbody id="rb"></tbody></table></div><div class="fw-bold text-danger mt-2" id="rtot"></div>`);
  runRep(m);
}

function runRep(m){
  const s=$('rs').value,e=$('re').value;
  if(m=='sum'){
    $('rb').innerHTML='<tr class="table-light"><th>LỚP</th><th>GVCN</th><th>DANH SÁCH VI PHẠM</th></tr>'+classes().map(l=>{const v=D('discipline').filter(d=>d.lop==l&&inR(d,s,e));return`<tr><td class="fw-bold">${esc(l)}</td><td>${esc(gvOf(l))}</td><td>${v.map(d=>`<small class="text-muted">[${dtxt(d.date).slice(5)}]</small> <b>${esc(d.name)}</b> (${esc(d.type)})`).join('<br>')}</td></tr>`}).join('');
    return $('rtot').innerText='';
  }
  const c=$('rc').value,t=$('rt').value,q=$('rq').value.toLowerCase(),v=D('discipline').filter(d=>inR(d,s,e)&&(!c||d.lop==c)&&(!t||d.type==t)&&(!q||String(d.name).toLowerCase().includes(q)));
  $('rb').innerHTML='<tr class="table-light"><th>NGÀY GIỜ</th><th>LỚP</th><th>HỌ TÊN</th><th>VI PHẠM</th><th>GHI CHÚ</th></tr>'+v.map(d=>`<tr><td>${dtxt(d.date)}</td><td>${esc(d.lop)}</td><td>${esc(d.name)}</td><td>${esc(d.type)}</td><td>${esc(d.note)}</td></tr>`).join('');
  $('rtot').innerText='Tổng số vụ: '+v.length;
}

  const ds=m=='all'?[{type:'bar',label:'Toàn trường',data:cnt(()=>1),backgroundColor:'#9ec5fe'},{type:'line',label:cl||'(chọn lớp)',data:cl?cnt(d=>d.lop==cl):[],borderColor:'#dc3545'}]:D('loi').map((l,i)=>({type:'line',label:l.name,data:cnt(d=>d.type==l.name),borderColor:col[i%8],tension:.3}));
  if(chart)chart.destroy();chart=new Chart($('tc'),{data:{labels:mo,datasets:ds},options:{maintainAspectRatio:false}});
}
