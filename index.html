<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduClass Pro - Bản độc lập</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body{background:#f0f2f5;font-family:'Segoe UI',Tahoma,sans-serif}
.mi{cursor:pointer;border:none;border-radius:12px!important;margin-bottom:4px;padding:10px 16px;font-weight:500}
.mi.active{background:#ebf8ff!important;color:#2b6cb0;border-left:5px solid #3182ce}
.gs{max-height:70vh;overflow:auto;border:1px solid #dee2e6;border-radius:12px;background:#fff}
.gs th{position:sticky;top:0;background:#f8fafc;z-index:2;color:#0d6efd;white-space:nowrap}
.gs td:first-child,.gs th:first-child{position:sticky;left:0;background:#fff;z-index:3;min-width:90px;border-right:3px solid #0d6efd}
#sidebar{width:260px;min-width:260px}
@media(max-width:768px){#sidebar{position:fixed;left:-260px;top:0;bottom:0;z-index:999;transition:.3s}#sidebar.open{left:0}}
</style>
</head>
<body>

<div id="login" class="d-flex align-items-center justify-content-center vh-100">
  <div class="card shadow-lg p-5 border-0 rounded-4" style="width:400px">
    <div class="text-center mb-4"><i class="fas fa-school fa-4x text-primary mb-2"></i>
      <h3 class="fw-bold">EduClass <span class="text-primary">Pro</span></h3></div>
    <input id="email" class="form-control mb-2" placeholder="Email" value="admin@edu.vn">
    <input id="pass" type="password" class="form-control mb-2" placeholder="Mật khẩu" value="admin123" onkeydown="if(event.key==='Enter')login()">
    <div id="err" class="text-danger small mb-2"></div>
    <button class="btn btn-primary w-100 rounded-pill fw-bold" onclick="login()">ĐĂNG NHẬP</button>
  </div>
</div>

<div id="app" class="d-none vh-100 d-flex overflow-hidden">
  <div id="sidebar" class="bg-white border-end d-flex flex-column">
    <div class="p-3 fw-bold text-primary fs-5 border-bottom"><i class="fas fa-graduation-cap text-warning me-2"></i>EduClass</div>
    <div id="menu" class="flex-grow-1 overflow-auto p-2"></div>
    <div class="p-3 border-top bg-light"><div id="uname" class="fw-bold small"></div><div id="urole" class="text-muted small mb-2"></div>
      <button class="btn btn-sm btn-outline-danger w-100 rounded-pill" onclick="logout()">Thoát</button></div>
  </div>
  <div class="flex-grow-1 d-flex flex-column overflow-hidden">
    <div class="bg-white border-bottom px-3 py-3 d-flex align-items-center gap-3">
      <button class="btn btn-outline-primary d-md-none" onclick="document.getElementById('sidebar').classList.toggle('open')"><i class="fas fa-bars"></i></button>
      <h5 id="title" class="m-0 fw-bold text-secondary text-uppercase"></h5>
    </div>
    <div id="content" class="p-3 overflow-auto flex-grow-1"></div>
  </div>
</div>

<script>
/* ================= CƠ SỞ DỮ LIỆU (localStorage) ================= */
const KEY = 'educlass_db_v1';
const SEED = {
  users: [{email:'admin@edu.vn', pass:'admin123', role:'ADMIN', name:'Admin Tổng'}],
  students: [{id:'HS01', name:'Nguyễn Văn A', lop:'9A', hocluc:'Giỏi', bantru:'X'}],
  gvcn: [{lop:'9A', gv:'Thầy Nguyễn Văn B'}, {lop:'9B', gv:'Cô Trần Thị C'}],
  loi: [{code:'L01', name:'Đi muộn', points:2}, {code:'L02', name:'Không làm bài', points:3}, {code:'L03', name:'Mất trật tự', points:2}],
  discipline: [], attendance: [], fund: []
};
let db = JSON.parse(localStorage.getItem(KEY) || 'null') || structuredClone(SEED);
const save = () => localStorage.setItem(KEY, JSON.stringify(db));
save();

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today = () => new Date().toISOString().slice(0, 10);
const classes = () => [...new Set(db.students.map(s => s.lop).concat(db.gvcn.map(g => g.lop)))].filter(Boolean).sort();
const clsOpts = (all) => (all ? '<option value="">Toàn trường</option>' : '<option value="">-- Chọn lớp --</option>') + classes().map(c => `<option>${esc(c)}</option>`).join('');
const gvOf = lop => (db.gvcn.find(g => g.lop === lop) || {}).gv || 'Chưa phân công';
const vnd = n => Number(n).toLocaleString('vi-VN') + ' đ';
let USER = null, chart = null;

/* ================= ĐĂNG NHẬP & PHÂN QUYỀN ================= */
const MENUS = {
  dashboard:['Tổng quan','fa-th-large'], students:['Quản lý học sinh','fa-user-graduate'],
  attendance:['Điểm danh','fa-user-check'], discipline:['Ghi nhận vi phạm','fa-exclamation-triangle'],
  grid:['Bảng điểm trừ / Thi đua','fa-table'], fund:['Quỹ lớp','fa-wallet'],
  settings:['Danh mục & Tài khoản','fa-cog'], backup:['Sao lưu / Khôi phục','fa-database']
};
const ROLE_MENU = {
  ADMIN: Object.keys(MENUS),
  GVCN: ['dashboard','students','attendance','discipline','grid','fund'],
  GVBM: ['dashboard','attendance','discipline'],
  LT: ['dashboard','attendance','discipline','fund'],
  HS: ['dashboard','fund'], PH: ['dashboard','fund']
};
function login() {
  const u = db.users.find(u => u.email.toLowerCase() === $('email').value.trim().toLowerCase() && u.pass === $('pass').value);
  if (!u) return $('err').innerText = 'Sai Email hoặc Mật khẩu!';
  USER = u; sessionStorage.setItem('u', u.email); boot();
}
function logout() { sessionStorage.removeItem('u'); location.reload(); }
function boot() {
  $('login').classList.add('d-none'); $('app').classList.remove('d-none');
  $('uname').innerText = USER.name; $('urole').innerText = USER.role;
  const ids = ROLE_MENU[String(USER.role).toUpperCase()] || ROLE_MENU.GVBM;
  $('menu').innerHTML = ids.map(id => `<div class="list-group-item mi" data-id="${id}" onclick="go('${id}')"><i class="fas ${MENUS[id][1]} text-primary me-3"></i>${MENUS[id][0]}</div>`).join('');
  go('dashboard');
}
window.onload = () => {
  const e = sessionStorage.getItem('u'); const u = e && db.users.find(x => x.email === e);
  if (u) { USER = u; boot(); }
};
const VIEWS = {dashboard:vDash, students:vStudents, attendance:vAtt, discipline:vDisc, grid:vGrid, fund:vFund, settings:vSettings, backup:vBackup};
function go(id) {
  document.querySelectorAll('.mi').forEach(e => e.classList.toggle('active', e.dataset.id === id));
  $('title').innerText = MENUS[id][0]; $('sidebar').classList.remove('open'); VIEWS[id]();
}

/* ================= TỔNG QUAN ================= */
function vDash() {
  $('content').innerHTML = `<select id="dc" class="form-select w-auto mb-3" onchange="drawDash()">${clsOpts(true)}</select>
  <div class="row g-3 mb-3 text-center">
    <div class="col-4"><div class="card p-3 border-0 shadow-sm rounded-4"><h3 id="d1">0</h3><small>SĨ SỐ</small></div></div>
    <div class="col-4"><div class="card p-3 border-0 shadow-sm rounded-4"><h3 id="d2">0%</h3><small>TỶ LỆ GIỎI</small></div></div>
    <div class="col-4"><div class="card p-3 border-0 shadow-sm rounded-4"><h3 id="d3">0</h3><small>VI PHẠM</small></div></div></div>
  <div class="card p-3 border-0 shadow-sm rounded-4" style="height:320px"><canvas id="ch"></canvas></div>`;
  drawDash();
}
function drawDash() {
  const c = $('dc').value, st = db.students.filter(s => !c || s.lop === c);
  const n = k => st.filter(s => s.hocluc === k).length;
  $('d1').innerText = st.length; $('d2').innerText = st.length ? Math.round(n('Giỏi') / st.length * 100) + '%' : '0%';
  $('d3').innerText = db.discipline.filter(d => !c || d.lop === c).length;
  if (chart) chart.destroy();
  chart = new Chart($('ch'), {type:'doughnut', data:{labels:['Giỏi','Khá','TB'], datasets:[{data:[n('Giỏi'), n('Khá'), st.length - n('Giỏi') - n('Khá')], backgroundColor:['#198754','#0d6efd','#ffc107']}]}, options:{maintainAspectRatio:false}});
}

/* ================= HỌC SINH ================= */
function vStudents() {
  $('content').innerHTML = `<div class="card p-3 mb-3 border-0 shadow-sm"><div class="row g-2">
    <div class="col-md-2"><input id="s-id" class="form-control" placeholder="Mã HS"></div>
    <div class="col-md-3"><input id="s-name" class="form-control" placeholder="Họ tên"></div>
    <div class="col-md-2"><input id="s-lop" class="form-control" placeholder="Lớp"></div>
    <div class="col-md-2"><select id="s-hl" class="form-select"><option>Giỏi</option><option>Khá</option><option>Trung bình</option></select></div>
    <div class="col-md-1"><button class="btn btn-primary w-100" onclick="addStudent()">+</button></div></div>
    <div class="mt-2 small text-muted">Hoặc nhập nhiều: dán mỗi dòng <code>Mã,Họ tên,Lớp</code>:</div>
    <textarea id="s-bulk" class="form-control mt-1" rows="3"></textarea>
    <button class="btn btn-sm btn-success mt-2" onclick="bulkStudents()">NHẬP DANH SÁCH</button></div>
  <select id="sf" class="form-select w-auto mb-2" onchange="listStudents()">${clsOpts(true)}</select>
  <div class="card table-responsive"><table class="table table-sm mb-0 align-middle"><thead class="table-light"><tr><th>Mã</th><th>Họ tên</th><th>Lớp</th><th>Học lực</th><th></th></tr></thead><tbody id="sl"></tbody></table></div>`;
  listStudents();
}
function listStudents() {
  const c = $('sf').value;
  $('sl').innerHTML = db.students.map((s, i) => ({s, i})).filter(x => !c || x.s.lop === c).map(({s, i}) =>
    `<tr><td>${esc(s.id)}</td><td><input class="form-control form-control-sm" value="${esc(s.name)}" onchange="db.students[${i}].name=this.value;save()"></td><td>${esc(s.lop)}</td><td>${esc(s.hocluc)}</td>
    <td><button class="btn btn-sm text-danger" onclick="delStudent(${i})"><i class="fas fa-trash"></i></button></td></tr>`).join('');
}
function addStudent() {
  const id = $('s-id').value.trim(), name = $('s-name').value.trim(), lop = $('s-lop').value.trim();
  if (!id || !name || !lop) return alert('Nhập đủ Mã, Tên, Lớp!');
  if (db.students.some(s => s.id === id)) return alert('Mã đã tồn tại!');
  db.students.push({id, name, lop, hocluc:$('s-hl').value, bantru:''}); save(); vStudents();
}
function bulkStudents() {
  let n = 0;
  $('s-bulk').value.split('\n').forEach(l => {
    const [id, name, lop] = l.split(',').map(x => x && x.trim());
    if (id && name && lop && !db.students.some(s => s.id === id)) { db.students.push({id, name, lop, hocluc:'Khá', bantru:''}); n++; }
  });
  save(); alert('Đã thêm ' + n + ' học sinh'); vStudents();
}
function delStudent(i) { if (confirm('Xóa học sinh?')) { db.students.splice(i, 1); save(); listStudents(); } }

/* ================= ĐIỂM DANH ================= */
function vAtt() {
  $('content').innerHTML = `<div class="card border-0 shadow-sm rounded-4"><div class="card-header bg-white d-flex flex-wrap gap-2 align-items-center">
    <select id="ac" class="form-select w-auto" onchange="listAtt()">${clsOpts()}</select>
    <input type="date" id="ad" class="form-control w-auto" value="${today()}" onchange="listAtt()">
    <span id="agv" class="badge bg-info bg-opacity-10 text-info"></span>
    <button class="btn btn-primary rounded-pill ms-auto px-4" onclick="saveAtt()">LƯU</button></div>
    <div class="table-responsive"><table class="table mb-0 align-middle"><tbody id="al"></tbody></table></div></div>`;
}
function listAtt() {
  const c = $('ac').value, d = $('ad').value; $('agv').innerText = c ? 'GVCN: ' + gvOf(c) : '';
  $('al').innerHTML = db.students.filter(s => s.lop === c).map(s => {
    const rec = db.attendance.find(a => a.date === d && a.id === s.id);
    return `<tr><td class="ps-3">${esc(s.name)}</td><td><select class="form-select form-select-sm w-auto" data-id="${esc(s.id)}"><option value="C">Có mặt</option><option value="V" ${rec && rec.status === 'V' ? 'selected' : ''}>Vắng</option></select></td></tr>`;
  }).join('');
}
function saveAtt() {
  const d = $('ad').value, c = $('ac').value; if (!c) return alert('Chọn lớp!');
  document.querySelectorAll('#al select').forEach(sel => {
    const s = db.students.find(x => x.id === sel.dataset.id);
    db.attendance = db.attendance.filter(a => !(a.date === d && a.id === s.id));
    db.attendance.push({date:d, id:s.id, name:s.name, lop:s.lop, status:sel.value});
  });
  save(); alert('✅ Đã lưu điểm danh!');
}

/* ================= VI PHẠM ================= */
function vDisc() {
  $('content').innerHTML = `<div class="row g-3"><div class="col-md-5"><div class="card p-4 border-0 shadow rounded-4 border-top border-danger border-5">
    <h6 class="fw-bold text-danger">PHIẾU KỶ LUẬT</h6>
    <select id="dl" class="form-select mb-2" onchange="discStudents()">${clsOpts()}</select>
    <select id="ds" class="form-select mb-2"></select>
    <select id="dt" class="form-select mb-2">${db.loi.map(l => `<option>${esc(l.name)}</option>`).join('')}</select>
    <textarea id="dn" class="form-control mb-3" rows="2" placeholder="Ghi chú"></textarea>
    <button class="btn btn-danger rounded-pill fw-bold" onclick="saveDisc()">GHI LỖI</button></div></div>
    <div class="col-md-7"><div class="card p-3 border-0 shadow-sm rounded-4"><h6>Lịch sử vi phạm</h6><div id="dh" class="list-group"></div></div></div></div>`;
  discHist();
}
function discStudents() {
  $('ds').innerHTML = db.students.filter(s => s.lop === $('dl').value).map(s => `<option value="${esc(s.id)}">${esc(s.name)}</option>`).join(''); discHist();
}
function discHist() {
  const c = $('dl').value;
  $('dh').innerHTML = db.discipline.filter(d => !c || d.lop === c).slice(-20).reverse().map(x =>
    `<div class="list-group-item small"><b>${esc(x.name)}</b> (${esc(x.lop)}) - ${esc(x.type)}<span class="text-muted float-end">${esc(x.date.replace('T', ' ').slice(0, 16))}</span><div class="text-muted">${esc(x.note)}</div></div>`).join('') || '<div class="text-muted">Chưa có.</div>';
}
function saveDisc() {
  const s = db.students.find(x => x.id === $('ds').value); if (!s) return alert('Chọn học sinh!');
  db.discipline.push({date:new Date().toISOString(), id:s.id, name:s.name, lop:s.lop, type:$('dt').value, note:$('dn').value});
  save(); $('dn').value = ''; discHist(); alert('✅ Đã ghi nhận!');
}

/* ================= BẢNG ĐIỂM TRỪ / THI ĐUA ================= */
function vGrid() {
  const t = today();
  $('content').innerHTML = `<div class="card border-0 shadow-sm rounded-4"><div class="card-header bg-white d-flex flex-wrap gap-2">
    <input type="date" id="gs" class="form-control w-auto" value="${t}"><input type="date" id="ge" class="form-control w-auto" value="${t}">
    <button class="btn btn-primary rounded-pill px-4" onclick="drawGrid()">LỌC</button></div>
    <div class="gs"><table class="table table-bordered table-sm text-center mb-0" id="gt"></table></div>
    <div class="card-footer small text-muted">Điểm thi đua bắt đầu từ 100, trừ theo điểm của từng lỗi.</div></div>`;
}
function drawGrid() {
  const s = $('gs').value, e = $('ge').value;
  const inR = d => { const x = d.date.slice(0, 10); return x >= s && x <= e; };
  const rows = classes().map(lop => {
    let pts = 100;
    const cells = db.loi.map(l => { const n = db.discipline.filter(d => d.lop === lop && d.type === l.name && inR(d)).length; pts -= n * l.points; return `<td>${n || ''}</td>`; }).join('');
    return {pts, html:`<tr><td class="fw-bold">${esc(lop)}</td><td>${esc(gvOf(lop))}</td>${cells}<td class="fw-bold text-danger">${pts}</td></tr>`};
  }).sort((a, b) => b.pts - a.pts);
  $('gt').innerHTML = `<thead><tr><th>LỚP</th><th>GVCN</th>${db.loi.map(l => `<th title="${esc(l.name)} (-${l.points})">${esc(l.code)}</th>`).join('')}<th>ĐIỂM</th></tr></thead><tbody>${rows.map(r => r.html).join('')}</tbody>`;
}

/* ================= QUỸ LỚP ================= */
function vFund() {
  $('content').innerHTML = `<select id="fc" class="form-select w-auto mb-3" onchange="drawFund()">${clsOpts()}</select>
  <div class="row g-3 mb-3 text-center text-white">
    <div class="col-4"><div class="card p-3 bg-success"><small>THU</small><h5 id="f1">0</h5></div></div>
    <div class="col-4"><div class="card p-3 bg-danger"><small>CHI</small><h5 id="f2">0</h5></div></div>
    <div class="col-4"><div class="card p-3 bg-primary"><small>TỒN</small><h5 id="f3">0</h5></div></div></div>
  <div class="card p-3 mb-3 border-0 shadow-sm"><div class="row g-2">
    <div class="col-md-5"><input id="fn" class="form-control" placeholder="Nội dung"></div>
    <div class="col-md-2"><select id="ft" class="form-select"><option>Thu</option><option>Chi</option></select></div>
    <div class="col-md-3"><input id="fa" type="number" class="form-control" placeholder="Số tiền"></div>
    <div class="col-md-2"><button class="btn btn-primary w-100" onclick="addFund()">LƯU</button></div></div></div>
  <div class="card table-responsive"><table class="table mb-0 small"><tbody id="fl"></tbody></table></div>`;
}
function drawFund() {
  const c = $('fc').value, items = db.fund.filter(f => f.lop === c);
  const sum = t => items.filter(f => f.type === t).reduce((a, f) => a + f.amount, 0);
  $('f1').innerText = vnd(sum('Thu')); $('f2').innerText = vnd(sum('Chi')); $('f3').innerText = vnd(sum('Thu') - sum('Chi'));
  $('fl').innerHTML = items.slice().reverse().map(f => `<tr><td>${esc(f.date)}</td><td>${esc(f.content)}</td><td>${esc(f.creator)}</td>
    <td class="text-end ${f.type === 'Thu' ? 'text-success' : 'text-danger'}">${f.type === 'Thu' ? '+' : '-'}${vnd(f.amount)}</td>
    <td><button class="btn btn-sm text-danger" onclick="delFund('${f.id}')"><i class="fas fa-trash"></i></button></td></tr>`).join('');
}
function addFund() {
  const c = $('fc').value; if (!c) return alert('Chọn lớp!');
  db.fund.push({id:'F' + Date.now(), date:new Date().toLocaleString('vi-VN'), content:$('fn').value, type:$('ft').value, amount:Number($('fa').value) || 0, lop:c, creator:USER.name});
  save(); drawFund();
}
function delFund(id) { if (confirm('Xóa giao dịch?')) { db.fund = db.fund.filter(f => f.id !== id); save(); drawFund(); } }

/* ================= DANH MỤC & TÀI KHOẢN ================= */
function crud(key, title, fields) {
  const head = fields.map(f => `<th>${f[1]}</th>`).join('');
  const rows = db[key].map((r, i) => `<tr>${fields.map(f => `<td><input class="form-control form-control-sm" value="${esc(r[f[0]])}" onchange="db.${key}[${i}].${f[0]}=${f[2] === 'n' ? 'Number(this.value)' : 'this.value'};save()"></td>`).join('')}
    <td><button class="btn btn-sm text-danger" onclick="db.${key}.splice(${i},1);save();vSettings()"><i class="fas fa-trash"></i></button></td></tr>`).join('');
  return `<div class="card border-0 shadow-sm rounded-4 mb-3"><div class="card-header bg-white d-flex justify-content-between"><b>${title}</b>
    <button class="btn btn-sm btn-success" onclick="db.${key}.push({${fields.map(f => f[0] + ':' + (f[2] === 'n' ? 0 : "''")).join(',')}});save();vSettings()">+ Thêm</button></div>
    <div class="table-responsive"><table class="table table-sm mb-0"><thead><tr>${head}<th></th></tr></thead><tbody>${rows}</tbody></table></div></div>`;
}
function vSettings() {
  $('content').innerHTML =
    crud('gvcn', 'Giáo viên chủ nhiệm', [['lop', 'Lớp'], ['gv', 'Tên GVCN']]) +
    crud('loi', 'Danh mục lỗi vi phạm', [['code', 'Mã'], ['name', 'Tên lỗi'], ['points', 'Điểm trừ', 'n']]) +
    crud('users', 'Tài khoản (vai trò: ADMIN, GVCN, GVBM, LT, HS, PH)', [['email', 'Email'], ['pass', 'Mật khẩu'], ['role', 'Vai trò'], ['name', 'Họ tên']]);
}

/* ================= SAO LƯU / KHÔI PHỤC ================= */
function vBackup() {
  $('content').innerHTML = `<div class="card p-4 border-0 shadow-sm rounded-4">
    <p class="text-muted">Dữ liệu lưu trong trình duyệt này. Hãy <b>xuất file sao lưu</b> thường xuyên, và dùng file đó để chuyển sang máy khác.</p>
    <div class="d-flex flex-wrap gap-2">
      <button class="btn btn-primary" onclick="exportDB()"><i class="fas fa-download me-1"></i>Xuất JSON</button>
      <label class="btn btn-success mb-0"><i class="fas fa-upload me-1"></i>Nhập JSON<input type="file" accept=".json" hidden onchange="importDB(this.files[0])"></label>
      <button class="btn btn-outline-secondary" onclick="exportCSV()"><i class="fas fa-file-csv me-1"></i>Xuất vi phạm CSV</button>
      <button class="btn btn-outline-danger" onclick="if(confirm('Xóa TOÀN BỘ dữ liệu?')){localStorage.removeItem(KEY);location.reload()}">Xóa hết</button>
    </div></div>`;
}
function dl(name, text, type) {
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name; a.click();
}
const exportDB = () => dl('educlass-backup-' + today() + '.json', JSON.stringify(db, null, 1), 'application/json');
function importDB(f) {
  if (!f) return; const r = new FileReader();
  r.onload = () => { try { const d = JSON.parse(r.result); if (!d.users || !d.students) throw 0; db = d; save(); alert('✅ Đã khôi phục!'); location.reload(); } catch (e) { alert('File không hợp lệ!'); } };
  r.readAsText(f);
}
function exportCSV() {
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  dl('vipham.csv', '\ufeffNgày,Mã,Họ tên,Lớp,Lỗi,Ghi chú\n' + db.discipline.map(d => [d.date, d.id, d.name, d.lop, d.type, d.note].map(q).join(',')).join('\n'), 'text/csv');
}
